name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare static output for GitHub Pages
        run: |
          set -e
          OUT=dist/client
          echo "Contenido real de $OUT:"
          ls -la "$OUT"
          # TanStack Start SPA puede generar index.html prerenderizado o solo _shell.html.
          # Usamos el que exista realmente como entrada principal.
          if [ -f "$OUT/index.html" ]; then
            ENTRY="$OUT/index.html"
          elif [ -f "$OUT/_shell.html" ]; then
            ENTRY="$OUT/_shell.html"
            cp "$ENTRY" "$OUT/index.html"
          else
            echo "ERROR: ni index.html ni _shell.html existen en $OUT" >&2
            exit 1
          fi
          # 404.html = misma shell SPA para que las rutas funcionen en GitHub Pages.
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "Entrada usada: $ENTRY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
