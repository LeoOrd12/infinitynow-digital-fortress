name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Inspect and prepare static output for GitHub Pages
        id: static-output
        shell: bash
        run: |
          set -euo pipefail

          echo "Estructura generada por el build:"
          for candidate in dist .output build; do
            if [ -e "$candidate" ]; then
              echo "--- $candidate ---"
              find "$candidate" -maxdepth 3 -print | sort
            fi
          done

          mapfile -t SHELLS < <(find dist .output build -type f \( -name '_shell.html' -o -name 'index.html' \) 2>/dev/null | sort)
          if [ "${#SHELLS[@]}" -eq 0 ]; then
            echo "ERROR: el build no generó _shell.html ni index.html en dist, .output o build." >&2
            exit 1
          fi

          ENTRY=""
          for file in "${SHELLS[@]}"; do
            if [ "$(basename "$file")" = "_shell.html" ]; then
              ENTRY="$file"
              break
            fi
          done
          if [ -z "$ENTRY" ]; then
            ENTRY="${SHELLS[0]}"
          fi

          OUT="$(dirname "$ENTRY")"
          echo "Directorio público detectado: $OUT"
          echo "Shell SPA detectado: $ENTRY"
          ls -la "$OUT"

          if [ "$(basename "$ENTRY")" = "_shell.html" ]; then
            cp "$ENTRY" "$OUT/index.html"
          fi
          cp "$OUT/index.html" "$OUT/404.html"

          if [ -f public/CNAME ] && [ ! -f "$OUT/CNAME" ]; then
            cp public/CNAME "$OUT/CNAME"
          fi
          touch "$OUT/.nojekyll"

          test -f "$OUT/index.html"
          test -f "$OUT/404.html"
          test -f "$OUT/CNAME"
          test -f "$OUT/.nojekyll"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.static-output.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
